<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>旁译桌面版</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    /* 球默认不抢焦点：它在旁边不打扰她 */
    user-select: none; cursor: default;
  }
  #ball {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: var(--size, 44px); height: var(--size, 44px); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 32% 28%, #E2B07A 0%, #C08A5E 42%, #8E5F3C 100%);
    box-shadow: 0 4px 12px rgba(60, 40, 26, .38), inset 0 1px 1px rgba(255, 240, 220, .55);
    color: #FFF6EA; font: 800 15px/1 "Microsoft YaHei", system-ui, sans-serif;
    letter-spacing: .02em; cursor: grab;
    transition: transform .12s ease, box-shadow .12s ease, opacity .18s ease;
    opacity: .86;
  }
  #ball:hover { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
  #ball:active { cursor: grabbing; transform: translate(-50%, -50%) scale(.96); }
  #ball.busy { animation: pulse 1.1s ease-in-out infinite; }
  #ball.paused { background: radial-gradient(circle at 32% 28%, #BFB3A6 0%, #9A8C7E 45%, #6E6357 100%); opacity: .55; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 4px 12px rgba(60, 40, 26, .38), 0 0 0 0 rgba(192, 138, 94, .55); }
    50% { box-shadow: 0 4px 12px rgba(60, 40, 26, .38), 0 0 0 10px rgba(192, 138, 94, 0); }
  }
  /* 球上的小提示：说过就消失。不占地方、不要点击。 */
  #toast {
    position: absolute; right: 100%; top: 50%; transform: translateY(-50%);
    margin-right: 8px; max-width: 240px;
    padding: 5px 9px; border-radius: 6px;
    background: #F8F3EB; color: #332A25;
    border: 1px solid #D8C9B9; box-shadow: 0 4px 12px rgba(74, 54, 42, .18);
    font: 600 12px/1.5 "Microsoft YaHei", system-ui, sans-serif;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; pointer-events: none; transition: opacity .16s ease;
  }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
  <div id="ball" title="旁译 · 点一下开面板，右键有菜单，拖动可以挪位置">译</div>
  <div id="toast"></div>
<script src="orb.js"></script>
</body>
</html>
